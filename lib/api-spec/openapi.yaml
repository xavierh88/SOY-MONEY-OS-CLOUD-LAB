openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SOY MONEY OS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
  - name: opportunities
  - name: evidence
  - name: pipeline
  - name: approvals
  - name: projects
  - name: activity
  - name: demand-proof
  - name: results
  - name: learning
  - name: cycles
  - name: money-lab
  - name: autonomy
  - name: human-actions
  - name: finance
  - name: control-tower
  - name: candidate-decisions
  - name: service-callbacks
  - name: discovery
security:
  - ClerkOwner: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get executive dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List opportunities
      responses:
        "200":
          description: Opportunity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: createOpportunity
      tags: [opportunities]
      summary: Create an opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "201":
          description: Created opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
  /opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [opportunities]
      summary: Get an opportunity with its evidence
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Opportunity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /discovery/research:
    post:
      operationId: researchDiscovery
      tags: [discovery]
      summary: Research a category using free public sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryResearchInput"
      responses:
        "201":
          description: Research completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResearchResponse"
        "422":
          description: No corroborated opportunity
    get:
      operationId: listDiscoveryResearch
      tags: [discovery]
      summary: List durable discovery research runs
      responses:
        "200":
          description: Research runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscoveryResearchRun" }
  /discovery/research/{id}:
    get:
      operationId: getDiscoveryResearch
      tags: [discovery]
      summary: Get a research run and its findings
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Research run and findings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResearchResponse"
  /opportunities/{id}/approval:
    get:
      operationId: getOpportunityApproval
      tags: [approvals]
      summary: Get the latest human approval for an opportunity
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Latest approval for the opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityApproval"
        "404":
          $ref: "#/components/responses/NotFound"
  /evidence:
    get:
      operationId: listEvidence
      tags: [evidence]
      summary: List persisted evidence
      parameters:
        - in: query
          name: opportunityId
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Evidence list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
        "400":
          description: Invalid opportunityId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createEvidence
      tags: [evidence]
      summary: Receive external evidence for an existing opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Stored evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "400":
          description: Invalid evidence payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Duplicate evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pipeline/start:
    post:
      operationId: startPipeline
      tags: [pipeline]
      summary: Start a research pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineInput"
      responses:
        "201":
          description: Pipeline execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRun"
  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List pending human approvals
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"
  /approvals/{id}/decision:
    post:
      operationId: decideApproval
      tags: [approvals]
      summary: Approve or reject a checkpoint
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionInput"
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project and its post-approval execution state
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Project execution detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{id}/start:
    post:
      operationId: startProjectBuild
      tags: [projects]
      summary: Build a structured deliverable for an approved planned project
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartProjectInput"
      responses:
        "200":
          description: Existing idempotent build result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildStageResponse"
        "201":
          description: Build completed and ready for QA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildStageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}/qa:
    post:
      operationId: reviewProjectQa
      tags: [projects]
      summary: Review a built project deliverable
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: QA result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaStageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}/sell-ready:
    post:
      operationId: prepareProjectSellReady
      tags: [projects]
      summary: Prepare a non-published commercial package after QA passes
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Sell-ready package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellReadyStageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}/result:
    post:
      operationId: recordProjectResult
      tags: [projects]
      summary: Record preparation result without claiming a sale
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Preparation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultStageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}/learning:
    post:
      operationId: recordProjectLearning
      tags: [projects]
      summary: Record learning from completed preparation stages
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Learning record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningStageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}/complete:
    post:
      operationId: completeProject
      tags: [projects]
      summary: Complete a project after result and learning are persisted
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Completed project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteStageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List execution activity
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /demand-proof:
    get:
      operationId: listDemandProof
      tags: [demand-proof]
      summary: List demand proof records
      responses:
        "200":
          description: Demand proof list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemandProof"
  /results:
    get:
      operationId: listResults
      tags: [results]
      summary: List results
      responses:
        "200":
          description: Results list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Result"
  /learning:
    get:
      operationId: listLearning
      tags: [learning]
      summary: List learning insights
      responses:
        "200":
          description: Learning insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningInsight"
  /cycles/current:
    get:
      operationId: getCurrentCycle
      tags: [cycles]
      summary: Get the latest persistent orchestration cycle
      responses:
        "200":
          description: Current cycle, or null when none exists
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Cycle"
                  - type: "null"
  /cycles:
    get:
      operationId: listAutonomousCycles
      tags: [autonomy]
      summary: List autonomous cycles without touching Windmill cycles
      responses:
        "200":
          description: Autonomous cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutonomousCycle"
    post:
      operationId: startCycle
      tags: [cycles]
      summary: Start the Windmill discovery flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleInput"
      responses:
        "201":
          description: Cycle started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "200":
          description: Existing idempotent cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "409":
          description: Another cycle is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cycles/{id}:
    get:
      operationId: getCycle
      tags: [cycles]
      summary: Synchronize and get a cycle
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Synchronized cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "404":
          $ref: "#/components/responses/NotFound"
  /cycles/{id}/decision:
    post:
      operationId: decideCycle
      tags: [cycles]
      summary: Apply a human decision and start continuation only after approval
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionInput"
      responses:
        "200":
          description: Updated cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid cycle state or conflicting decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /money-lab/market-cycle/start:
    post:
      operationId: startMarketCycle
      tags: [money-lab]
      summary: Dispatch the GitHub Actions market research cycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketCycleInput"
      responses:
        "201":
          description: Market cycle dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCycle"
        "200":
          description: Existing idempotent market cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCycle"
        "409":
          description: Another manual market cycle is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: GitHub connection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /money-lab/market-cycle/status/{id}:
    get:
      operationId: getMarketCycleStatus
      tags: [money-lab]
      summary: Synchronize and return a market cycle
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Synchronized market cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCycle"
        "404":
          $ref: "#/components/responses/NotFound"
  /autonomy/controlled-golden-path/prepare:
    post:
      operationId: prepareControlledGoldenPath
      tags: [autonomy]
      summary: Prepare a controlled, zero-capital Golden Path checkpoint
      description: >
        Creates only durable PAPER/POTENTIAL records and a pending owner
        checkpoint. This endpoint never approves an action, publishes,
        spends money, or calls an external provider.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlledGoldenPathPrepareInput"
      responses:
        "201":
          description: Prepared Golden Path checkpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlledGoldenPathPrepareResponse"
        "400":
          description: Invalid idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Durable checkpoint could not be prepared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /autonomy/controlled-golden-path/status/{id}:
    get:
      operationId: getControlledGoldenPathStatus
      tags: [autonomy]
      summary: Read a controlled Golden Path checkpoint
      description: Read-only status; it never resumes or approves the checkpoint.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Controlled Golden Path status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlledGoldenPathStatusResponse"
        "400":
          description: Invalid cycle identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /money-lab/market-cycles:
    get:
      operationId: listMarketCycles
      tags: [money-lab]
      summary: List persisted market cycles
      responses:
        "200":
          description: Market cycle history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketCycle"
  /money-lab/market-cycles/{id}:
    get:
      operationId: getMarketCycle
      tags: [money-lab]
      summary: Get one persisted market cycle
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Market cycle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCycle"
        "404":
          $ref: "#/components/responses/NotFound"
  /money-lab/summary:
    get:
      operationId: getMoneyLabSummary
      tags: [money-lab]
      summary: Get Market Lab aggregate status
      responses:
        "200":
          description: Market Lab summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyLabSummary"
  /autonomy/start:
    post:
      operationId: startAutonomy
      tags: [autonomy]
      summary: Enable the persisted autonomy controller
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutonomyControlInput"
      responses:
        "200":
          description: Autonomy state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomyState"
  /autonomy/stop:
    post:
      operationId: stopAutonomy
      tags: [autonomy]
      summary: Disable the autonomy controller
      responses:
        "200":
          description: Autonomy state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomyState"
  /autonomy/pause:
    post:
      operationId: pauseAutonomy
      tags: [autonomy]
      summary: Pause new autonomous cycles
      responses:
        "200":
          description: Autonomy state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomyState"
  /autonomy/resume:
    post:
      operationId: resumeAutonomy
      tags: [autonomy]
      summary: Resume autonomous cycles
      responses:
        "200":
          description: Autonomy state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomyState"
  /autonomy/status:
    get:
      operationId: getAutonomyStatus
      tags: [autonomy]
      summary: Get persisted autonomy state
      responses:
        "200":
          description: Autonomy state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomyState"
  /service/v1/callback:
    post:
      operationId: receiveServiceCallback
      tags: [service-callbacks]
      security:
        - ServiceHmac: []
      summary: Receive an authenticated, replay-safe service transition
      description: >
        Machine-to-machine callback boundary. The provider must send the
        service identity, allowlisted operation, dispatch identifier, current
        timestamp, SHA-256 hash of the exact request bytes, and an HMAC-SHA256
        signature. This endpoint does not use owner authentication and never
        starts an external job.
      parameters:
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "#/components/parameters/ServiceOperation"
        - $ref: "#/components/parameters/ServiceTimestamp"
        - $ref: "#/components/parameters/ServiceDispatchId"
        - $ref: "#/components/parameters/ServiceBodySha256"
        - $ref: "#/components/parameters/ServiceSignature"
        - $ref: "#/components/parameters/ServiceMethod"
        - $ref: "#/components/parameters/ServicePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCallbackBody"
      responses:
        "202":
          description: New callback receipt accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCallbackResponse"
        "200":
          description: Identical callback replay accepted idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCallbackResponse"
        "400":
          description: Invalid callback headers, body hash, or method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Expired timestamp or invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Unknown service or disallowed operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: dispatch_id is not known
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflicting replay for dispatch_id and transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service credential or callback persistence unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /autonomy/activity:
    get:
      operationId: listAutonomyActivity
      tags: [autonomy]
      summary: List autonomous cycle activity
      responses:
        "200":
          description: Autonomous cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutonomousCycle"
  /autonomy/learning:
    get:
      operationId: listAutonomyLearning
      tags: [autonomy]
      summary: List autonomy learning records
      responses:
        "200":
          description: Learning records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutonomyLearning"
  /cycles/run:
    post:
      operationId: runAutonomousCycle
      tags: [autonomy]
      summary: Run one safe, idempotent autonomous cycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleRunInput"
      responses:
        "201":
          description: Autonomous cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomousCycle"
        "200":
          description: Existing idempotent autonomous cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomousCycle"
        "409":
          description: Autonomy is not enabled or slot is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /autonomy/cycles/{id}:
    get:
      operationId: getAutonomousCycle
      tags: [autonomy]
      summary: Get an autonomous cycle without touching Windmill cycles
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Autonomous cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutonomousCycle"
        "404":
          $ref: "#/components/responses/NotFound"
  /autonomy/cycles:
    get:
      operationId: listAutonomyCycles
      tags: [autonomy]
      summary: List autonomous cycles
      responses:
        "200":
          description: Autonomous cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutonomousCycle"
  /candidates:
    get:
