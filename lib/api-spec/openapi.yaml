        status: { type: string }
        projectId: { type: integer }
        opportunityId: { type: integer }
        nextStage: { type: string }
        qaStatus: { type: string }
        qaScore: { type: integer }
        issues: { type: array, items: { type: string } }
        recommendations: { type: array, items: { type: string } }
        checkedAt: { type: string, format: date-time }
    SellReadyStageResponse:
      type: object
      required: [status, projectId, opportunityId, nextStage, sellPackage]
