            - $ref: "#/components/schemas/LearningInsight"
            - type: "null"
    StartProjectInput:
      type: object
      required: [deliverableType]
      properties:
        deliverableType:
          type: string
          enum: [DIGITAL_PRODUCT, SERVICE, LANDING_PAGE, SITE_MVP, SERVICE_PACKAGE, AUTOMATION, PROTOTYPE, REPORT, CONSULTING_OFFER, CONTENT_PRODUCT, OTHER]
