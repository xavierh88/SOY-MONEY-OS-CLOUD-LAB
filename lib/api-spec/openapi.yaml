  /control-tower/overview:
    get:
      operationId: getControlTowerOverview
      tags: [control-tower]
      summary: Read the persisted operational control tower overview
      responses:
        "200":
          description: Control tower overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlTowerOverview"
  /control-tower/timeline:
    get:
      operationId: getControlTowerTimeline
      tags: [control-tower]
      summary: Read the unified persisted operational timeline
      responses:
        "200":
          description: Unified timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ControlTowerTimelineEvent"
  /control-tower/golden-path/{cycleId}:
    get:
      operationId: getControlTowerGoldenPath
      tags: [control-tower]
      security:
        - ClerkOwner: []
      summary: Read the persisted Golden Path chain for one autonomous cycle
      description: >
        Read-only reconstruction of the durable chain. It correlates the cycle
        with candidate decisions, opportunity/evidence, project/execution,
        human checkpoints, learning/results/finance, lifecycle history,
        external dispatches, and outbox records. This GET does not create or
        resume work, approve an action, call a provider, or mutate history.
      parameters:
        - $ref: "#/components/parameters/CycleId"
      responses:
        "200":
          description: Persisted Golden Path chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlTowerGoldenPathResponse"
        "400":
          description: cycleId must be a positive integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Autonomous cycle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /control-tower/opportunities/{id}:
    get:
      operationId: getControlTowerOpportunity
      tags: [control-tower]
      summary: Read a complete persisted business opportunity control-tower model
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Opportunity control-tower detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlTowerOpportunityDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /control-tower/projects/{id}:
    get:
      operationId: getControlTowerProject
      tags: [control-tower]
      summary: Read persisted project progress and gates
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Project control-tower detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlTowerProjectDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /money-lab/market-cycles/{id}/candidates:
    get:
      operationId: listMarketCycleCandidates
      tags: [money-lab]
      summary: Read candidates from a persisted Market Lab result
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Persisted market cycle candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketCycleCandidate"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    ClerkOwner:
      type: apiKey
      in: cookie
      name: __session
      description: >
        Clerk session for the single persisted SOY MONEY owner. Human and
        browser operations are owner-only; client-supplied owner identifiers
        are never accepted.
    ServiceHmac:
      type: apiKey
      in: header
      name: X-Service-Signature
      description: >
        HMAC-SHA256 machine authentication. Pair this header with
        X-Service-Id, X-Service-Operation, X-Service-Timestamp, X-Dispatch-Id,
        X-Body-Sha256, and the canonical method/path headers.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    CycleId:
      name: cycleId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ServiceId:
      name: X-Service-Id
      in: header
      required: true
      schema:
        type: string
        enum: [windmill]
      description: Allowlisted machine service identity.
    ServiceOperation:
      name: X-Service-Operation
      in: header
      required: true
      schema:
        type: string
        enum: [windmill.callback, windmill.job.completed, windmill.job.failed]
    ServiceTimestamp:
      name: X-Service-Timestamp
      in: header
      required: true
      schema:
        type: string
      description: Unix seconds or milliseconds, within five minutes of server time.
    ServiceDispatchId:
      name: X-Dispatch-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
    ServiceBodySha256:
      name: X-Body-Sha256
      in: header
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{64}$"
      description: Lowercase SHA-256 hex digest of the exact JSON request bytes.
    ServiceSignature:
      name: X-Service-Signature
      in: header
      required: true
      schema:
        type: string
      description: HMAC-SHA256 hex over timestamp.method.path.dispatch_id.body_hash.
    ServiceMethod:
      name: X-Service-Method
      in: header
      required: false
      schema:
        type: string
        enum: [POST]
    ServicePath:
      name: X-Service-Path
      in: header
      required: false
      schema:
        type: string
        enum: [/api/service/v1/callback]
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Opportunity:
      type: object
      required: [id, name, description, sector, problem, targetCustomer, proposedSolution, monetizationMethod, score, estimatedCost, difficulty, risk, timeToRevenue, status, proofStatus, source, sourceUrl, category, titleClaim, evidenceRefs, fingerprint, researchStatus, demandConfidence, detectedAt, validFrom, validUntil, expiresAt, expirationReason, expiredAt, expirationOutcome, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        sector: { type: string }
        problem: { type: string }
        targetCustomer: { type: string }
        proposedSolution: { type: string }
        monetizationMethod: { type: string }
        score: { type: integer }
        estimatedCost: { type: number }
        difficulty: { type: string }
        risk: { type: string }
        timeToRevenue: { type: string }
        status: { type: string }
        proofStatus: { type: string }
        source: { type: string }
        sourceUrl: { type: ["string", "null"], format: uri }
        category: { type: string }
        titleClaim: { type: ["string", "null"] }
        evidenceRefs: { type: array, items: { type: string } }
        fingerprint: { type: ["string", "null"] }
        researchStatus: { type: string }
        demandConfidence: { type: number }
        detectedAt: { type: ["string", "null"], format: date-time }
        validFrom: { type: ["string", "null"], format: date-time }
        validUntil: { type: ["string", "null"], format: date-time }
        expiresAt: { type: ["string", "null"], format: date-time }
        expirationReason: { type: ["string", "null"] }
        expiredAt: { type: ["string", "null"], format: date-time }
        expirationOutcome: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DiscoveryResearchInput:
      type: object
      required: [category]
      properties:
        category:
          type: string
          enum: [BUSINESS, DIGITAL_PRODUCTS, SERVICES, SAAS, AUTOMATION, AFFILIATE, OTHER_LEGAL_OPPORTUNITIES, SPORTS]
        query: { type: string, maxLength: 240 }
        idempotencyKey: { type: string, maxLength: 240 }
    DiscoveryResearchRun:
      type: object
      required: [id, idempotencyKey, category, query, status, sourceCount, independentSourceCount, acceptedCount, scoreBreakdown, startedAt, createdAt, updatedAt]
      properties:
        id: { type: integer }
        idempotencyKey: { type: string }
        category: { type: string }
        query: { type: string }
        status: { type: string }
        sourceCount: { type: integer }
        independentSourceCount: { type: integer }
        acceptedCount: { type: integer }
        rejectionReason: { type: ["string", "null"] }
        scoreBreakdown: { type: object, additionalProperties: { type: number } }
        startedAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DiscoveryResearchResponse:
      type: object
      required: [run, findings]
      properties:
        run: { $ref: "#/components/schemas/DiscoveryResearchRun" }
        opportunities:
          type: array
          items: { $ref: "#/components/schemas/Opportunity" }
        findings: { type: array, items: { type: object, additionalProperties: true } }
        accepted: { type: boolean }
        error: { type: ["object", "null"], additionalProperties: true }
    OpportunityMetadata:
      type: object
      required: [id, opportunityId, normalizedName, normalizedProblem, normalizedTarget, normalizedSolution, contentHash, similarityFingerprint, scoreBreakdown, demandProofStatus, createdAt, updatedAt]
      properties:
        id: { type: integer }
        opportunityId: { type: integer }
        normalizedName: { type: string }
        normalizedProblem: { type: string }
        normalizedTarget: { type: string }
        normalizedSolution: { type: string }
        contentHash: { type: string }
        similarityFingerprint: { type: string }
        scoreBreakdown: { type: object, additionalProperties: { type: number } }
        demandProofStatus: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OpportunityInput:
      type: object
      required: [name, description, sector, problem, targetCustomer, proposedSolution, monetizationMethod]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        sector: { type: string, minLength: 1 }
        problem: { type: string, minLength: 1 }
        targetCustomer: { type: string, minLength: 1 }
        proposedSolution: { type: string, minLength: 1 }
        monetizationMethod: { type: string, minLength: 1 }
    Evidence:
      type: object
      required: [id, opportunityId, source, url, collectedAt, claim, verificationStatus, contradictions, gaps, proofType]
      properties:
        id: { type: integer }
        opportunityId: { type: integer }
        source: { type: string }
        url: { type: string }
        collectedAt: { type: string, format: date-time }
        claim: { type: string }
        verificationStatus: { type: string }
        contradictions: { type: array, items: { type: string } }
        gaps: { type: array, items: { type: string } }
        proofType: { type: string }
        evidenceRef: { type: ["string", "null"] }
        independenceKey: { type: ["string", "null"] }
        freshnessScore: { type: ["number", "null"] }
    OpportunityApproval:
      type: object
      required: [approvalId, opportunityId, status, decision, createdAt, updatedAt]
      properties:
        approvalId: { type: integer }
        opportunityId: { type: integer }
        status: { type: string }
        decision: { type: string, nullable: true, enum: [approved, rejected, null] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EvidenceInput:
      type: object
      required: [opportunityId, source, url, claim, collectedAt, proofType, verificationStatus]
      properties:
        opportunityId: { type: integer }
        source: { type: string, minLength: 1 }
        url: { type: string, format: uri, minLength: 1 }
        claim: { type: string, minLength: 1 }
        collectedAt: { type: string, format: date-time }
        proofType:
          type: string
          enum: [SEARCH_EVIDENCE]
        verificationStatus:
          type: string
          enum: [NOT_VERIFIED]
    OpportunityDetail:
      allOf:
        - $ref: "#/components/schemas/Opportunity"
        - type: object
          required: [evidence]
          properties:
            evidence:
              type: array
              items:
                $ref: "#/components/schemas/Evidence"
    PipelineInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 2 }
    PipelineRun:
      type: object
      required: [executionId, opportunity, steps, status]
      properties:
        executionId: { type: integer }
        opportunity:
          $ref: "#/components/schemas/Opportunity"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        status: { type: string }
    Activity:
      type: object
      required: [id, executionId, stage, status, message, createdAt]
      properties:
        id: { type: integer }
        executionId: { type: integer }
        stage: { type: string }
        status: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    Approval:
      type: object
      required: [id, opportunityId, type, status, reason, createdAt]
      properties:
        id: { type: integer }
        opportunityId: { type: integer }
        type: { type: string }
        status: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: ["string", "null"], format: date-time }
    ApprovalDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
    Project:
      type: object
      required: [id, opportunityId, name, status, qaIssues, qaRecommendations, publicationExecuted, marketingExecuted, saleExecuted, financialExecution, createdAt, updatedAt]
      properties:
        id: { type: integer }
        opportunityId: { type: integer }
        originCandidateId: { type: ["integer", "null"] }
        originOpportunityId: { type: ["integer", "null"] }
        originCycleId: { type: ["integer", "null"] }
        creationIdempotencyKey: { type: ["string", "null"] }
        name: { type: string }
        status: { type: string }
        qaStatus: { type: ["string", "null"] }
        qaScore: { type: ["integer", "null"] }
        qaIssues: { type: array, items: { type: string } }
        qaRecommendations: { type: array, items: { type: string } }
        qaCheckedAt: { type: ["string", "null"], format: date-time }
        sellPackage: { type: ["object", "null"], additionalProperties: true }
        publicationExecuted: { type: boolean }
        marketingExecuted: { type: boolean }
        saleExecuted: { type: boolean }
        financialExecution: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectExecution:
      type: object
      required: [id, opportunityId, projectId, status, currentStage, deliverableType, deliverable, buildNotes, startedAt, updatedAt, createdAt]
      properties:
        id: { type: integer }
        opportunityId: { type: integer }
        projectId: { type: integer }
        status: { type: string }
        currentStage: { type: string }
        deliverableType: { type: ["string", "null"] }
        deliverable: { type: ["object", "null"], additionalProperties: true }
        buildNotes: { type: ["string", "null"] }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ProjectDetail:
      type: object
      required: [project, execution, result, learning]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        execution:
          oneOf:
            - $ref: "#/components/schemas/ProjectExecution"
