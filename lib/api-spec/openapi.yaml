      properties:
        id: { type: integer }
        projectId: { type: integer }
        resultType: { type: string }
        outcome: { type: string }
        status: { type: string }
        revenue: { type: number }
        cost: { type: ["number", "null"] }
        profit: { type: ["number", "null"] }
        mode: { $ref: "#/components/schemas/FinanceMode" }
        financeIdempotencyKey: { type: ["string", "null"] }
        realRevenue: { type: boolean }
        createdAt: { type: string, format: date-time }
    LearningInsight:
      type: object
      required: [id, title, summary, status, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: ["integer", "null"] }
        title: { type: string }
        summary: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    Dashboard:
      type: object
      required: [opportunitiesFound, opportunitiesVerified, projects, activeProcesses, failedProcesses, pendingApprovals, results, systemStatus, recentActivity]
      properties:
        opportunitiesFound: { type: integer }
        opportunitiesVerified: { type: integer }
        projects: { type: integer }
        activeProcesses: { type: integer }
        failedProcesses: { type: integer }
        pendingApprovals: { type: integer }
        results: { type: integer }
        systemStatus: { type: string }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    CycleInput:
      type: object
      required: [query, idempotencyKey]
      properties:
        query: { type: string, minLength: 2 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
    Cycle:
      type: object
      required: [id, idempotencyKey, state, stage, message, startedAt, updatedAt, createdAt]
      properties:
        id: { type: integer }
        idempotencyKey: { type: string }
        discoveryJobId: { type: ["string", "null"] }
        continuationJobId: { type: ["string", "null"] }
