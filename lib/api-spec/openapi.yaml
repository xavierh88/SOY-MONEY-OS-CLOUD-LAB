openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SOY MONEY OS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
  - name: opportunities
  - name: evidence
  - name: pipeline
  - name: approvals
  - name: projects
  - name: activity
  - name: demand-proof
  - name: results
  - name: learning
  - name: cycles
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get executive dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List opportunities
      responses:
        "200":
          description: Opportunity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: createOpportunity
      tags: [opportunities]
      summary: Create an opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "201":
          description: Created opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
  /opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [opportunities]
      summary: Get an opportunity with its evidence
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Opportunity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /opportunities/{id}/approval:
    get:
      operationId: getOpportunityApproval
      tags: [approvals]
      summary: Get the latest human approval for an opportunity
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Latest approval for the opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityApproval"
        "404":
          $ref: "#/components/responses/NotFound"
  /evidence:
    get:
      operationId: listEvidence
      tags: [evidence]
      summary: List persisted evidence
      parameters:
        - in: query
          name: opportunityId
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Evidence list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
        "400":
          description: Invalid opportunityId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createEvidence
      tags: [evidence]
      summary: Receive external evidence for an existing opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Stored evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "400":
          description: Invalid evidence payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Duplicate evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pipeline/start:
    post:
      operationId: startPipeline
      tags: [pipeline]
      summary: Start a research pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineInput"
      responses:
        "201":
          description: Pipeline execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRun"
  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List pending human approvals
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"
  /approvals/{id}/decision:
    post:
      operationId: decideApproval
      tags: [approvals]
      summary: Approve or reject a checkpoint
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionInput"
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project and its post-approval execution state
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Project execution detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{id}/start:
    post:
      operationId: startProjectBuild
      tags: [projects]
      summary: Build a structured deliverable for an approved planned project
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartProjectInput"
      responses:
        "200":
          description: Existing idempotent build result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildStageResponse"
        "201":
          description: Build completed and ready for QA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildStageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}/qa:
    post:
      operationId: reviewProjectQa
      tags: [projects]
      summary: Review a built project deliverable
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: QA result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaStageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}/sell-ready:
    post:
      operationId: prepareProjectSellReady
      tags: [projects]
      summary: Prepare a non-published commercial package after QA passes
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Sell-ready package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellReadyStageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}/result:
    post:
      operationId: recordProjectResult
      tags: [projects]
      summary: Record preparation result without claiming a sale
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Preparation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultStageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}/learning:
    post:
      operationId: recordProjectLearning
      tags: [projects]
      summary: Record learning from completed preparation stages
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Learning record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningStageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}/complete:
    post:
      operationId: completeProject
      tags: [projects]
      summary: Complete a project after result and learning are persisted
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Completed project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteStageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List execution activity
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /demand-proof:
    get:
      operationId: listDemandProof
      tags: [demand-proof]
      summary: List demand proof records
      responses:
        "200":
          description: Demand proof list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemandProof"
  /results:
    get:
      operationId: listResults
      tags: [results]
      summary: List results
      responses:
        "200":
          description: Results list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Result"
  /learning:
    get:
      operationId: listLearning
      tags: [learning]
      summary: List learning insights
      responses:
        "200":
          description: Learning insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningInsight"
  /cycles/current:
    get:
      operationId: getCurrentCycle
      tags: [cycles]
      summary: Get the latest persistent orchestration cycle
      responses:
        "200":
          description: Current cycle, or null when none exists
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Cycle"
                  - type: "null"
  /cycles:
    post:
      operationId: startCycle
      tags: [cycles]
      summary: Start the Windmill discovery flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleInput"
      responses:
        "201":
          description: Cycle started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "200":
          description: Existing idempotent cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "409":
          description: Another cycle is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cycles/{id}:
    get:
      operationId: getCycle
      tags: [cycles]
      summary: Synchronize and get a cycle
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Synchronized cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "404":
          $ref: "#/components/responses/NotFound"
  /cycles/{id}/decision:
    post:
      operationId: decideCycle
      tags: [cycles]
      summary: Apply a human decision and start continuation only after approval
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionInput"
      responses:
        "200":
          description: Updated cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid cycle state or conflicting decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Opportunity:
      type: object
      required: [id, name, description, sector, problem, targetCustomer, proposedSolution, monetizationMethod, score, estimatedCost, difficulty, risk, timeToRevenue, status, proofStatus, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        sector: { type: string }
        problem: { type: string }
        targetCustomer: { type: string }
        proposedSolution: { type: string }
        monetizationMethod: { type: string }
        score: { type: integer }
        estimatedCost: { type: number }
        difficulty: { type: string }
        risk: { type: string }
        timeToRevenue: { type: string }
        status: { type: string }
        proofStatus: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OpportunityInput:
      type: object
      required: [name, description, sector, problem, targetCustomer, proposedSolution, monetizationMethod]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        sector: { type: string, minLength: 1 }
        problem: { type: string, minLength: 1 }
        targetCustomer: { type: string, minLength: 1 }
        proposedSolution: { type: string, minLength: 1 }
        monetizationMethod: { type: string, minLength: 1 }
    Evidence:
      type: object
      required: [id, opportunityId, source, url, collectedAt, claim, verificationStatus, contradictions, gaps, proofType]
      properties:
        id: { type: integer }
        opportunityId: { type: integer }
        source: { type: string }
        url: { type: string }
        collectedAt: { type: string, format: date-time }
        claim: { type: string }
        verificationStatus: { type: string }
        contradictions: { type: array, items: { type: string } }
        gaps: { type: array, items: { type: string } }
        proofType: { type: string }
    OpportunityApproval:
      type: object
      required: [approvalId, opportunityId, status, decision, createdAt, updatedAt]
      properties:
        approvalId: { type: integer }
        opportunityId: { type: integer }
        status: { type: string }
        decision: { type: string, nullable: true, enum: [approved, rejected, null] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EvidenceInput:
      type: object
      required: [opportunityId, source, url, claim, collectedAt, proofType, verificationStatus]
      properties:
        opportunityId: { type: integer }
        source: { type: string, minLength: 1 }
        url: { type: string, format: uri, minLength: 1 }
        claim: { type: string, minLength: 1 }
        collectedAt: { type: string, format: date-time }
        proofType:
          type: string
          enum: [SEARCH_EVIDENCE]
        verificationStatus:
          type: string
          enum: [NOT_VERIFIED]
    OpportunityDetail:
      allOf:
        - $ref: "#/components/schemas/Opportunity"
        - type: object
          required: [evidence]
          properties:
            evidence:
              type: array
              items:
                $ref: "#/components/schemas/Evidence"
    PipelineInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 2 }
    PipelineRun:
      type: object
      required: [executionId, opportunity, steps, status]
      properties:
        executionId: { type: integer }
        opportunity:
          $ref: "#/components/schemas/Opportunity"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        status: { type: string }
    Activity:
      type: object
      required: [id, executionId, stage, status, message, createdAt]
      properties:
        id: { type: integer }
        executionId: { type: integer }
        stage: { type: string }
        status: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    Approval:
      type: object
      required: [id, opportunityId, type, status, reason, createdAt]
      properties:
        id: { type: integer }
        opportunityId: { type: integer }
        type: { type: string }
        status: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: ["string", "null"], format: date-time }
    ApprovalDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
    Project:
      type: object
      required: [id, opportunityId, name, status, qaIssues, qaRecommendations, publicationExecuted, marketingExecuted, saleExecuted, financialExecution, createdAt, updatedAt]
      properties:
        id: { type: integer }
        opportunityId: { type: integer }
        name: { type: string }
        status: { type: string }
        qaStatus: { type: ["string", "null"] }
        qaScore: { type: ["integer", "null"] }
        qaIssues: { type: array, items: { type: string } }
        qaRecommendations: { type: array, items: { type: string } }
        qaCheckedAt: { type: ["string", "null"], format: date-time }
        sellPackage: { type: ["object", "null"], additionalProperties: true }
        publicationExecuted: { type: boolean }
        marketingExecuted: { type: boolean }
        saleExecuted: { type: boolean }
        financialExecution: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectExecution:
      type: object
      required: [id, opportunityId, projectId, status, currentStage, deliverableType, deliverable, buildNotes, startedAt, updatedAt, createdAt]
      properties:
        id: { type: integer }
        opportunityId: { type: integer }
        projectId: { type: integer }
        status: { type: string }
        currentStage: { type: string }
        deliverableType: { type: string }
        deliverable: { type: object, additionalProperties: true }
        buildNotes: { type: string }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ProjectDetail:
      type: object
      required: [project, execution, result, learning]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        execution:
          oneOf:
            - $ref: "#/components/schemas/ProjectExecution"
            - type: "null"
        result:
          oneOf:
            - $ref: "#/components/schemas/Result"
            - type: "null"
        learning:
          oneOf:
            - $ref: "#/components/schemas/LearningInsight"
            - type: "null"
    StartProjectInput:
      type: object
      required: [deliverableType]
      properties:
        deliverableType:
          type: string
          enum: [DIGITAL_PRODUCT, SERVICE, LANDING_PAGE, REPORT, AUTOMATION, CONSULTING_OFFER, CONTENT_PRODUCT, OTHER]
        buildNotes: { type: string }
    BuildStageResponse:
      type: object
      required: [status, projectId, opportunityId, nextStage, execution]
      properties:
        status: { type: string }
        projectId: { type: integer }
        opportunityId: { type: integer }
        nextStage: { type: string }
        execution:
          $ref: "#/components/schemas/ProjectExecution"
    QaStageResponse:
      type: object
      required: [status, projectId, opportunityId, nextStage, qaStatus, qaScore, issues, recommendations, checkedAt]
      properties:
        status: { type: string }
        projectId: { type: integer }
        opportunityId: { type: integer }
        nextStage: { type: string }
        qaStatus: { type: string }
        qaScore: { type: integer }
        issues: { type: array, items: { type: string } }
        recommendations: { type: array, items: { type: string } }
        checkedAt: { type: string, format: date-time }
    SellReadyStageResponse:
      type: object
      required: [status, projectId, opportunityId, nextStage, sellPackage]
      properties:
        status: { type: string }
        projectId: { type: integer }
        opportunityId: { type: integer }
        nextStage: { type: string }
        sellPackage: { type: object, additionalProperties: true }
    ResultStageResponse:
      type: object
      required: [status, projectId, opportunityId, nextStage, result]
      properties:
        status: { type: string }
        projectId: { type: integer }
        opportunityId: { type: integer }
        nextStage: { type: string }
        result:
          $ref: "#/components/schemas/Result"
    LearningStageResponse:
      type: object
      required: [status, projectId, opportunityId, nextStage, learning]
      properties:
        status: { type: string }
        projectId: { type: integer }
        opportunityId: { type: integer }
        nextStage: { type: string }
        learning:
          $ref: "#/components/schemas/LearningInsight"
    CompleteStageResponse:
      type: object
      required: [status, projectId, opportunityId, nextStage, project]
      properties:
        status: { type: string }
        projectId: { type: integer }
        opportunityId: { type: integer }
        nextStage: { type: string }
        project:
          $ref: "#/components/schemas/Project"
    DemandProof:
      type: object
      required: [id, opportunityId, proofType, status, summary, createdAt]
      properties:
        id: { type: integer }
        opportunityId: { type: integer }
        proofType: { type: string }
        status: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
    Result:
      type: object
      required: [id, projectId, resultType, outcome, status, revenue, realRevenue, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        resultType: { type: string }
        outcome: { type: string }
        status: { type: string }
        revenue: { type: number }
        realRevenue: { type: boolean }
        createdAt: { type: string, format: date-time }
    LearningInsight:
      type: object
      required: [id, title, summary, status, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: ["integer", "null"] }
        title: { type: string }
        summary: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    Dashboard:
      type: object
      required: [opportunitiesFound, opportunitiesVerified, projects, activeProcesses, failedProcesses, pendingApprovals, results, systemStatus, recentActivity]
      properties:
        opportunitiesFound: { type: integer }
        opportunitiesVerified: { type: integer }
        projects: { type: integer }
        activeProcesses: { type: integer }
        failedProcesses: { type: integer }
        pendingApprovals: { type: integer }
        results: { type: integer }
        systemStatus: { type: string }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    CycleInput:
      type: object
      required: [query, idempotencyKey]
      properties:
        query: { type: string, minLength: 2 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
    Cycle:
      type: object
      required: [id, idempotencyKey, state, stage, message, startedAt, updatedAt, createdAt]
      properties:
        id: { type: integer }
        idempotencyKey: { type: string }
        discoveryJobId: { type: ["string", "null"] }
        continuationJobId: { type: ["string", "null"] }
        opportunityId: { type: ["integer", "null"] }
        approvalId: { type: ["integer", "null"] }
        projectId: { type: ["integer", "null"] }
        state: { type: string }
        stage: { type: string }
        message: { type: string }
        error: { type: ["string", "null"] }
        errorService: { type: ["string", "null"] }
        errorStatusCode: { type: ["integer", "null"] }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
