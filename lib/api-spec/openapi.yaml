        status: { type: string }
        projectId: { type: integer }
        opportunityId: { type: integer }
        nextStage: { type: string }
        sellPackage: { type: object, additionalProperties: true }
    ResultStageResponse:
      type: object
      required: [status, projectId, opportunityId, nextStage, result]
      properties:
        status: { type: string }
        projectId: { type: integer }
        opportunityId: { type: integer }
        nextStage: { type: string }
        result:
          $ref: "#/components/schemas/Result"
    LearningStageResponse:
      type: object
      required: [status, projectId, opportunityId, nextStage, learning]
      properties:
        status: { type: string }
        projectId: { type: integer }
        opportunityId: { type: integer }
        nextStage: { type: string }
        learning:
          $ref: "#/components/schemas/LearningInsight"
    CompleteStageResponse:
      type: object
      required: [status, projectId, opportunityId, nextStage, project]
      properties:
        status: { type: string }
        projectId: { type: integer }
        opportunityId: { type: integer }
        nextStage: { type: string }
        project:
          $ref: "#/components/schemas/Project"
    DemandProof:
      type: object
      required: [id, opportunityId, proofType, status, summary, createdAt]
      properties:
        id: { type: integer }
        opportunityId: { type: integer }
        proofType: { type: string }
        status: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
    Result:
