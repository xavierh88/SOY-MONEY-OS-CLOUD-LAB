          enum: [MONEY_LAB_CANDIDATE, OPPORTUNITY_CANDIDATE]
        candidateRef: { type: ["string", "null"] }
        candidateId: { type: ["integer", "null"] }
        opportunityId: { type: ["integer", "null"] }
        autonomousCycleId: { type: ["integer", "null"] }
        decision:
          type: string
          enum: [SELECTED_PENDING_OWNER, APPROVED, REJECTED, BLOCKED, OPPORTUNITY_CANDIDATE]
        decisionReason: { type: ["string", "null"] }
        score: { type: ["number", "null"] }
        confidence: { type: ["number", "null"] }
        risk: { type: ["string", "null"] }
        decidedAt: { type: ["string", "null"], format: date-time }
        decidedBy: { type: ["string", "null"] }
        nextAction: { type: ["string", "null"] }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ControlledGoldenPathPrepareInput:
      type: object
      additionalProperties: false
      properties:
        idempotencyKey:
          type: string
          maxLength: 200
          description: Repeating this key returns the same durable preparation.
    ControlledGoldenPathPrepareResponse:
      type: object
      required: [cycleId, opportunityId, projectId, actionId, decisionId, state, checkpoint, nextInstruction, fixtureKey, safe]
      properties:
        cycleId: { type: integer }
        opportunityId: { type: integer }
        projectId: { type: integer }
        actionId: { type: integer }
        decisionId: { type: integer }
        state: { type: string, enum: [WAITING_HUMAN] }
        checkpoint: { type: string }
        nextInstruction: { type: string }
        fixtureKey: { type: string }
        safe: { type: boolean, enum: [true] }
    ControlledGoldenPathStatusResponse:
      type: object
      required: [cycle, opportunity, project, humanActions, nextInstruction]
      properties:
        cycle:
          $ref: "#/components/schemas/AutonomousCycle"
        opportunity:
          oneOf:
            - $ref: "#/components/schemas/Opportunity"
            - type: "null"
        project:
          oneOf:
            - $ref: "#/components/schemas/Project"
            - type: "null"
        humanActions:
          type: array
          items:
            $ref: "#/components/schemas/HumanAction"
        nextInstruction: { type: string }
    ServiceCallbackBody:
      type: object
      additionalProperties: true
      required: [dispatch_id, status]
      properties:
        dispatch_id: { type: string }
        transition: { type: string }
        status: { type: string }
        job_id: { type: string }
        run_id: { type: string }
        result: { type: object, additionalProperties: true }
    ServiceCallbackResponse:
      type: object
      required: [accepted, replay, receiptId]
      properties:
        accepted: { type: boolean, enum: [true] }
        replay: { type: boolean }
        receiptId: { type: integer }
    ExternalDispatch:
      type: object
      description: Durable external work reservation created before any provider request.
      required: [id, dispatchId, provider, operation, entityType, payloadHash, payload, status, attemptCount, createdAt]
      properties:
        id: { type: integer }
        dispatchId: { type: string }
        provider: { type: string }
        operation: { type: string }
        entityType: { type: string }
        entityId: { type: ["string", "null"] }
        cycleId: { type: ["integer", "null"] }
        marketCycleId: { type: ["integer", "null"] }
        opportunityId: { type: ["integer", "null"] }
        projectId: { type: ["integer", "null"] }
        payloadHash: { type: string }
        payload: { type: object, additionalProperties: true }
        status:
          type: string
          enum: [CREATED, DISPATCHING, ACCEPTED, RUNNING, COMPLETED, FAILED, RECONCILING, CANCELLED]
        attemptCount: { type: integer, minimum: 0 }
        externalJobId: { type: ["string", "null"] }
        externalRunId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        dispatchedAt: { type: ["string", "null"], format: date-time }
        acknowledgedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        lastError: { type: ["string", "null"] }
        nextRetryAt: { type: ["string", "null"], format: date-time }
        resultReference: { type: ["string", "null"] }
        result: { type: ["object", "null"], additionalProperties: true }
    ServiceReceipt:
      type: object
      description: Immutable replay receipt for one dispatch transition.
      required: [id, receiptKey, serviceId, operation, status, createdAt]
      properties:
        id: { type: integer }
        receiptKey: { type: string }
        serviceId: { type: string }
        dispatchId: { type: ["integer", "null"] }
        externalDispatchId: { type: ["string", "null"] }
        operation: { type: string }
        transition: { type: ["string", "null"] }
        externalJobId: { type: ["string", "null"] }
        externalRunId: { type: ["string", "null"] }
        status: { type: string }
        payloadHash: { type: ["string", "null"] }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

