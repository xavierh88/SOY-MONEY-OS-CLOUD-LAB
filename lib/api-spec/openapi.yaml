    BuildStageResponse:
      type: object
      required: [status, projectId, opportunityId, nextStage, execution]
      properties:
        status: { type: string }
        projectId: { type: integer }
        opportunityId: { type: integer }
        nextStage: { type: string }
        execution:
          $ref: "#/components/schemas/ProjectExecution"
    QaStageResponse:
      type: object
      required: [status, projectId, opportunityId, nextStage, qaStatus, qaScore, issues, recommendations, checkedAt]
